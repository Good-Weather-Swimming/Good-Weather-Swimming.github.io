<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if location.name %}{{ location.name }} | {% endif %}Good Weather Swimming</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Join Good Weather Swimming at {{ location.name }}, {{ location.region }}. A free open-water swimming community. Check our weather-based schedule and dive in!">
    <meta name="keywords" content="Swimming {{ location.name }}, Open Water Swimming, Swimming Group, Sea Swimming, Good Weather Swimming">
    <meta name="author" content="Good Weather Swimming">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://good-weather-swimming.github.io{{ location.urlPath }}">
    <meta property="og:title" content="Good Weather Swimming {{ location.name }} | {{ location.region }}">
    <meta property="og:description" content="An open community of swimmers enjoying the open water. No fees, no fuss—just good weather and great company.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&q=80&w=1200&h=630">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://good-weather-swimming.github.io{{ location.urlPath }}">
    <meta property="twitter:title" content="Good Weather Swimming {{ location.name }}">
    <meta property="twitter:description" content="Join our free open-water swimming group in {{ location.region }}. Weather-based swim windows for all levels.">
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&q=80&w=1200&h=630">

    <!-- Favicon using Swimming Emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏊</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        :root {
            --primary-blue: #004d7a;
            --deep-navy: #002d4d; 
            --ocean-blue: #0077be;
            --energy-pink: #ff4d6d; 
            --sand: #fdf5e6;
            --sand-border: #e6dec9;
        }

        /* Base Styles */
        body {
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
            background-color: var(--sand);
            color: #0f172a;
        }

        h1, h2, h3, .font-display {
            font-family: 'Playfair Display', serif;
        }

        /* Theme Utility Classes */
        .text-primary { color: var(--primary-blue); }
        .text-pink { color: var(--energy-pink); }
        .bg-primary { background-color: var(--primary-blue); }
        .bg-sand { background-color: var(--sand); }
        .bg-navy { background-color: var(--deep-navy); }
        .border-theme-sand { border-color: var(--sand-border); }
        .border-sky-soft { border-color: #e0f2fe; }

        /* Component Classes */
        .btn-pink {
            background-color: var(--energy-pink);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-pink:hover {
            background-color: #ff1a43;
            transform: scale(1.05);
        }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-bottom: 1px solid rgba(0, 77, 122, 0.1);
            z-index: 50;
            transition: background-color 0.3s ease;
        }

        /* Responsive Header Logic */
        @media (min-width: 768px) {
            .glass-sticky {
                position: sticky;
                top: 0;
            }
        }

        .hero-gradient {
            background: linear-gradient(rgba(0, 77, 122, 0.7), rgba(139, 69, 19, 0.5)), 
                        url('https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&q=80&w=2000') center/cover;
        }

        .whatsapp-pulse {
            animation: pulse-pink 2s infinite;
        }

        @keyframes pulse-pink {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }

        /* Layout Containers */
        .responsive-iframe-container {
            position: relative;
            padding-bottom: 50vh; 
            height: 0;
            overflow: hidden;
            max-width: 100%;
        }

        @media (min-width: 768px) {
            .responsive-iframe-container {
                padding-bottom: 0;
                height: 600px;
            }
        }

        .responsive-iframe-container iframe {
            border: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .section-padding { padding-top: 6rem; padding-bottom: 6rem; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="glass glass-sticky shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center flex-wrap">
                <a href="/" class="flex items-center hover:opacity-80 transition">
                    <span class="text-2xl font-bold italic font-display">
                        <span class="text-primary">GWS</span>
                        <span class="text-pink"> {{ location.name }}</span>
                    </span>
                </a>

                
                <div class="flex items-center gap-4">
                    <a href="{{ location.whatsappGroup }}" target="_blank" class="btn-pink px-6 py-2 rounded-lg font-bold shadow-lg flex items-center gap-2">
                        <i class="fab fa-whatsapp"></i> Join Group
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Block -->
    {{ content | safe }}

    <!-- Footer -->
    <footer class="py-12 text-white bg-navy">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="flex flex-col md:flex-row justify-between items-center border-b border-white/10 pb-8 mb-8">
                <div class="text-2xl font-bold italic mb-4 md:mb-0 font-display">
                    GWS <span class="text-pink">{{ location.name }}</span>
                </div>
                <div class="text-sm opacity-70">
                    {{ location.region }}
                </div>
            </div>
            <p class="text-blue-100/70 text-sm">Created for the love of open water swimming.</p>
        </div>
    </footer>

    <script>
        // Navbar glass adjustment on scroll
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (nav && window.scrollY > 50) {
                nav.style.backgroundColor = "rgba(255, 255, 255, 0.95)";
                nav.classList.add('shadow-md');
            } else if (nav) {
                nav.style.backgroundColor = "rgba(255, 255, 255, 0.8)";
                nav.classList.remove('shadow-md');
            }
        });
    </script>
</body>
</html>
